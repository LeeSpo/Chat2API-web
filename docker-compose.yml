services:
  chat2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat2api:latest
    container_name: chat2api
    restart: unless-stopped
    stop_grace_period: ${CHAT2API_STOP_GRACE_PERIOD:-10m}
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      CHAT2API_DATA_DIR: "/data"
      CHAT2API_MANAGEMENT_SECRET: "${CHAT2API_MANAGEMENT_SECRET:-}"
      CHAT2API_ENCRYPTION_KEY: "${CHAT2API_ENCRYPTION_KEY:-${CHAT2API_STORAGE_ENCRYPTION_KEY:-}}"
    volumes:
      - chat2api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chat2api-data:
