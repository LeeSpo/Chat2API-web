services:
  chat2api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ${CHAT2API_IMAGE:-chat2api:latest}
    container_name: chat2api
    restart: unless-stopped
    stop_grace_period: ${CHAT2API_STOP_GRACE_PERIOD:-10m}
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      CHAT2API_DATA_DIR: "/data"
      CHAT2API_MANAGEMENT_SECRET: "${CHAT2API_MANAGEMENT_SECRET:-}"
      CHAT2API_ENCRYPTION_KEY: "${CHAT2API_ENCRYPTION_KEY:-${CHAT2API_STORAGE_ENCRYPTION_KEY:-}}"
      CHAT2API_QWEN_AI_BROWSER_MODE: "${CHAT2API_QWEN_AI_BROWSER_MODE:-off}"
      QWEN_AI_BROWSER_SIDECAR_URL: "http://qwen-browser:3000"
      QWEN_AI_BROWSER_SIDECAR_SECRET: "${QWEN_AI_BROWSER_SIDECAR_SECRET:-chat2api-qwen-browser-internal}"
    volumes:
      - chat2api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qwen-browser:
    profiles: ["qwen-browser"]
    build:
      context: .
      dockerfile: Dockerfile
      target: qwen-browser
    image: ${QWEN_AI_BROWSER_IMAGE:-chat2api-qwen-browser:latest}
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "${QWEN_AI_BROWSER_SHM_SIZE:-1gb}"
    environment:
      CHAT2API_DATA_DIR: "/data"
      QWEN_AI_BROWSER_SIDECAR_SECRET: "${QWEN_AI_BROWSER_SIDECAR_SECRET:-chat2api-qwen-browser-internal}"
      QWEN_AI_BROWSER_TIMEZONE: "${QWEN_AI_BROWSER_TIMEZONE:-Asia/Shanghai}"
    volumes:
      - qwen-browser-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  chat2api-data:
  qwen-browser-data:
